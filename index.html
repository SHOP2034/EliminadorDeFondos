<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eliminador de Fondos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🧼 Eliminador</h1>
  </header>

  <main class="app-container">
    <!-- SUBIR IMAGEN -->
    <section class="upload-section card compact-card">
      <h2>Imagen</h2>
      <input type="file" id="fileInput" accept="image/*" class="input-file" />
      <button id="removeBgBtn" disabled class="btn-primary small-btn">Quitar fondo</button>
    </section>

    <!-- PROCESO -->
    <section id="process-container" class="progress-wrapper hidden compact-card">
      <label>Procesando...</label>
      <div class="progress-bar"><div id="process-progress"></div></div>
    </section>

    <!-- CANVAS -->
    <section class="canvas-section card compact-card">
      <canvas id="canvas" width="300" height="300"></canvas>
      <a id="downloadLink" class="btn-download hidden small-btn" download="resultado.png">⬇ Descargar</a>
    </section>

    <!-- HERRAMIENTAS -->
    <section id="edit-tools" class="tools card compact-card hidden">
      <h2>Editar</h2>

      <div class="tool-row">
        <button id="undoBtn" class="btn-tool">↶</button>
        <button id="redoBtn" class="btn-tool">↷</button>
        <button id="eraserBtn" class="btn-tool">Goma</button>
      </div>

      <div class="tool-row">
        <button id="restoreBtn" class="btn-tool">Restaurar</button>
        <button id="clearBtn" class="btn-danger">Limpiar</button>
      </div>

      <div class="tool-row">
        <label>Tamaño</label>
        <input type="range" id="brushSize" min="5" max="100" value="20" />
        <span id="brushSizeValue">20px</span>
      </div>

      <!-- NUEVA SECCIÓN DE FONDOS -->
      <h3>Fondo</h3>
      <div class="tool-row fondo-wrapper">
        <button id="addBgBtn" class="btn-secondary small-btn">Agregar fondo ▸</button>

        <div id="bgOptions" class="bg-options hidden">
          <button id="bgColorBtn" class="btn-secondary small-btn">🎨 Agregar color</button>
          <input type="color" id="bgColorPicker" class="hidden" value="#ffffff" />

          <button id="bgImageBtn" class="btn-secondary small-btn">🖼️ Agregar imagen</button>
          <input type="file" id="bgImageInput" class="hidden" accept="image/*" />
        </div>
      </div>
    </section>

    <!-- ESTADO -->
    <p id="status" class="status">🖼️ Esperando…</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
