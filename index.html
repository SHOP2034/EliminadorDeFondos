<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eliminador de Fondos</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>🧼 Eliminador de Fondos</h1>
    <p>Subí una imagen de un producto y quitá el fondo fácilmente.</p>

    <input type="file" id="fileInput" accept="image/*">
    <button id="removeBgBtn" disabled>Quitar fondo</button>

    <div id="process-container" class="progress-container hidden">
      <label>Procesando imagen...</label>
      <div id="process-progress" class="progress-bar"></div>
    </div>

    <canvas id="canvas" width="400" height="400"></canvas>

    <div id="edit-tools" class="hidden">
      <h3>Herramientas de edición</h3>
      <div class="tool-controls">
        <button id="undoBtn">↶</button>
        <button id="redoBtn">➥</button>
        <button id="eraserBtn" class="tool-btn">🧽 Goma</button>
        <button id="restoreBtn" class="tool-btn">↩️ Restaurar</button>
        <button id="clearBtn" class="tool-btn">🗑️ Limpiar</button>
      </div>
      <div class="brush-controls">
        <label for="brushSize">Tamaño de goma:</label>
        <input type="range" id="brushSize" min="5" max="100" value="20">
        <span id="brushSizeValue">20px</span>
      </div>
    </div>

    <p id="status">🖼️ Esperando imagen...</p>

    <a id="downloadLink" class="hidden" download="sin_fondo.png">⬇️ Descargar resultado</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
