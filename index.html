<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eliminador de Fondos</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>🧼 Eliminador de Fondos</h1>
    <p>Subí una imagen de un producto y quitá el fondo fácilmente.</p>

    <input type="file" id="fileInput" accept="image/*">
    <button id="removeBgBtn" disabled>Quitar fondo</button>

    <div class="progress-container">
      <label>📦 Cargando modelo...</label>
      <div id="model-progress" class="progress-bar"></div>
    </div>

    <div id="process-container" class="progress-container hidden">
      <label>Procesando imagen...</label>
      <div id="process-progress" class="progress-bar"></div>
    </div>

    <canvas id="canvas" width="400" height="400"></canvas>

    <a id="downloadLink" class="hidden" download="sin_fondo.png">⬇️ Descargar resultado</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
